[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "treeview-cli"
version = "1.0.0"
description = "Print a directory tree that automatically respects .gitignore, with no dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "All Rights Reserved" }
authors = [{ name = "sidcore-dev" }]
keywords = ["tree", "directory", "gitignore", "cli", "devtools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Environment :: Console",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/sidcore-dev/treeview-cli"
Repository = "https://github.com/sidcore-dev/treeview-cli"
Issues = "https://github.com/sidcore-dev/treeview-cli/issues"

[project.scripts]
treeview-cli = "treeview_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
